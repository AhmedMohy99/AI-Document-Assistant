<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 md:p-10">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <header class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">DocuMind AI</h1>
            <p class="text-blue-100 text-sm">Upload a PDF and ask anything about its content.</p>
        </header>

        <section class="p-6 border-b bg-slate-50">
            <div class="flex flex-col md:flex-row items-center gap-4">
                <input type="file" id="fileInput" accept=".pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                <button onclick="uploadPDF()" id="uploadBtn" class="bg-blue-600 text-white px-6 py-2 rounded-full font-medium hover:bg-blue-700 transition flex items-center gap-2 shrink-0">
                    <i class="fas fa-upload"></i> Analyze PDF
                </button>
            </div>
            <p id="status" class="text-xs mt-3 text-slate-500"></p>
        </section>

        <section id="chat-window" class="h-96 overflow-y-auto p-6 space-y-4 bg-white">
            <div class="bg-slate-100 p-4 rounded-lg text-slate-700 text-sm">
                Waiting for a document... Please upload a PDF to begin.
            </div>
        </section>

        <footer class="p-4 bg-slate-50 border-t flex gap-2">
            <input type="text" id="userQuestion" placeholder="Ask a question about the document..." class="flex-1 p-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none"/>
            <button onclick="askAI()" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">
                <i class="fas fa-paper-plane"></i>
            </button>
        </footer>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileInput.files[0]) return alert("Select a file first!");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            status.innerText = "Processing document... this may take a moment.";
            btn.disabled = true;

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.message) {
                status.className = "text-xs mt-3 text-green-600 font-bold";
                status.innerText = data.message;
                addMessage('assistant', "Document ready! What would you like to know?");
            } else {
                status.innerText = "Error: " + data.error;
            }
            btn.disabled = false;
        }

        async function askAI() {
            const input = document.getElementById('userQuestion');
            const question = input.value.trim();
            if (!question) return;

            addMessage('user', question);
            input.value = '';

            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            addMessage('assistant', data.answer || data.error);
        }

        function addMessage(role, text) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = role === 'user' ? 'ml-auto bg-blue-600 text-white p-3 rounded-lg max-w-[80%]' : 'mr-auto bg-slate-100 text-slate-800 p-3 rounded-lg max-w-[80%]';
            div.innerText = text;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }
    </script>
</body>
</html>
