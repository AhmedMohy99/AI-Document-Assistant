<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-10 flex flex-col items-center">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[85vh]">
        <header class="bg-slate-900 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">DocuMind AI</h1>
                <p class="text-xs text-slate-400">PDF Knowledge Assistant</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="fileInput" accept=".pdf" class="hidden" onchange="uploadPDF()"/>
                <label for="fileInput" id="uploadLabel" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg cursor-pointer transition text-sm font-medium">
                    <i class="fas fa-file-pdf mr-2"></i>Upload PDF
                </label>
            </div>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4 bg-white">
            <div class="bg-slate-100 p-3 rounded-lg text-sm max-w-[80%]">
                Hello! Please upload a PDF document so I can help you analyze it.
            </div>
        </div>

        <div class="p-4 bg-slate-50 border-t flex gap-2">
            <input type="text" id="userQuestion" placeholder="Ask a question..." class="flex-1 p-3 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none"/>
            <button onclick="askAI()" class="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-black transition">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('fileInput');
            const label = document.getElementById('uploadLabel');
            if (!fileInput.files[0]) return;

            label.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Analyzing...';
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.message) {
                label.innerHTML = '<i class="fas fa-check mr-2"></i>Ready';
                label.className = "bg-green-600 px-4 py-2 rounded-lg text-white text-sm";
                addMessage('assistant', "I've finished reading your document. Ask me anything!");
            } else {
                alert(data.error);
                label.innerHTML = '<i class="fas fa-file-pdf mr-2"></i>Try Again';
            }
        }

        async function askAI() {
            const input = document.getElementById('userQuestion');
            const question = input.value.trim();
            if (!question) return;

            addMessage('user', question);
            input.value = '';

            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            addMessage('assistant', data.answer || data.error);
        }

        function addMessage(role, text) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = role === 'user' ? 'ml-auto bg-blue-600 text-white p-3 rounded-xl max-w-[85%]' : 'mr-auto bg-slate-100 text-slate-800 p-3 rounded-xl max-w-[85%]';
            div.innerText = text;
            win.appendChild(div);
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
